<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>99 Names of Allah · Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:wght@400;600&family=Nunito:wght@400;600&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e4;--ink:#2a2a26;--mute:#7a7465;--gold:#a8802f;--card:#fffaf0;--card2:#0f3d36;--card2ink:#f3ead2;--line:#e2d6b8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a18;--ink:#efe6cf;--mute:#9aa596;--gold:#d4ad55;--card:#13302b;--card2:#1a463e;--card2ink:#f3ead2;--line:#264a43;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a18;--ink:#efe6cf;--mute:#9aa596;--gold:#d4ad55;--card:#13302b;--card2:#1a463e;--card2ink:#f3ead2;--line:#264a43;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;
background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);background-size:26px 26px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 30px}
header{text-align:center}
.bism{font-family:Amiri,serif;font-size:26px;color:var(--gold)}
h1{margin:2px 0 0;font-weight:600;font-size:26px;letter-spacing:.5px}
.sub{color:var(--mute);font-style:italic;font-size:16px;margin:2px 0 10px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.stat{display:flex;justify-content:space-between;color:var(--mute);font-size:15px;margin:6px 2px 12px}
.flip{perspective:1200px;cursor:pointer;outline:none}
.inner{position:relative;height:min(480px,66vh);transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;border:1px solid var(--gold);backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.front{background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.front:before{content:"";position:absolute;inset:9px;border:1px dashed var(--gold);border-radius:15px;opacity:.5;pointer-events:none}
.num{position:absolute;top:20px;left:24px;color:var(--gold);font-size:17px}
.ar{font-family:Amiri,"Traditional Arabic",serif;font-size:clamp(56px,17vw,88px);line-height:1.5;color:var(--gold);direction:rtl}
.tr{font-size:30px;font-weight:600;margin-top:4px}
.hint{position:absolute;bottom:20px;color:var(--mute);font-style:italic;font-size:15px}
.back{background:var(--card2);color:var(--card2ink);transform:rotateY(180deg)}
.back h2{margin:0;font-size:24px;font-weight:600}
.back .mean{color:var(--gold);font-style:italic;font-size:22px;margin:0 0 12px}
.sec{margin:12px 0 0}
.sec b{display:block;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.sec p{margin:0;line-height:1.35}
.dua{font-style:italic;border-left:2px solid var(--gold);padding-left:10px}
.copy{margin-top:8px;background:none;border:1px solid var(--gold);color:var(--card2ink);border-radius:14px;padding:3px 12px;font:inherit;font-size:15px;cursor:pointer}
.ctrl{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap}
button.b{font:inherit;font-size:17px;background:var(--card);color:var(--ink);border:1px solid var(--gold);border-radius:24px;padding:8px 16px;cursor:pointer}
button.b:hover{background:var(--gold);color:#fff}
button.main{background:var(--gold);color:#fff}
button.on{background:var(--gold);color:#fff}
.small{margin-top:14px;text-align:center;color:var(--mute);font-size:14px}
.small a{color:var(--gold);cursor:pointer;text-decoration:underline;margin:0 6px}
.note{margin-top:16px;text-align:center;color:var(--mute);font-size:14px;font-style:italic}
@media (prefers-reduced-motion:reduce){.inner,.bar i{transition:none}}
body{font-family:var(--bf,"Cormorant Garamond",Georgia,serif)}
.bism,.arf,.ar{font-family:var(--af,Amiri,serif)}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;justify-content:center;margin:12px 0 10px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:16px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:20px;padding:5px 14px;cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.inp{width:100%;font:inherit;padding:9px 14px;border-radius:20px;border:1px solid var(--gold);background:var(--card);color:var(--ink);margin-bottom:12px}
textarea.inp{border-radius:14px;min-height:70px;resize:vertical;margin-bottom:0}
select.inp{margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px 8px;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
.tile:hover{border-color:var(--gold)}
.tile .a{font-family:var(--af,Amiri,serif);font-size:24px;color:var(--gold);line-height:1.5;display:block}
.tile .t{font-size:14px;display:block}
.tile .n{position:absolute;top:4px;left:7px;font-size:11px;color:var(--mute)}
.tile.l:after{content:"✓";position:absolute;top:3px;right:7px;color:var(--gold);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border:0;border-bottom:1px dashed var(--line);cursor:pointer;color:var(--ink);background:none;font:inherit;text-align:left;width:100%}
.task .bx{flex:none;width:22px;height:22px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px}
.task.d .bx{background:var(--gold)}
.task.d span{text-decoration:line-through;opacity:.6}
.tap{width:130px;height:130px;border-radius:50%;border:2px solid var(--gold);background:var(--card2);color:var(--card2ink);font:inherit;font-size:30px;cursor:pointer;display:block;margin:8px auto}
.sw{display:inline-block;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;margin:3px;padding:0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.big{font-size:34px;color:var(--gold);text-align:center;line-height:1.4}
.cen{text-align:center}
.mut{color:var(--mute);font-size:15px}
#scene{position:fixed;inset:0;z-index:-1;display:none}
html.scn #scene{display:block;animation:fi .8s}
@keyframes fi{from{opacity:0}to{opacity:1}}
html.scn body{background:none}
html.scn header,html.scn .stat,html.scn .note,html.scn .small,html.scn .mut,html.scn .sub{text-shadow:0 1px 6px rgba(0,0,0,.5)}
html.scn .tabs button{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.25);color:var(--ink)}
html.scn .tabs button.on,html.scn button.main,html.scn button.on,html.scn button.b:hover{background:var(--gold);color:#25133a;text-shadow:none}
html.scn .task .bx{color:#25133a}
html.scn .panel,html.scn .tile{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

<body>
<div id="scene" aria-hidden="true"></div>
<div class="wrap">
<header>
<div class="bism">بسم الله الرحمن الرحيم</div>
<h1>The 99 Names</h1>
<div class="sub">Al-Asmā’ al-Ḥusnā · the most beautiful names</div>
</header>
<nav class="tabs" id="tabs"><button data-v="cards" class="on">Cards</button><button data-v="browse">Browse</button><button data-v="daily">Daily</button><button data-v="set">Settings</button></nav>
<div id="v-cards" class="view">
<div class="bar"><i id="bar"></i></div>
<div class="stat"><span id="pos"></span><span id="lcount"></span></div>

<div class="flip" id="flip" tabindex="0" role="button" aria-label="Flashcard, press to flip">
<div class="inner">
<div class="face front">
<div class="num" id="num"></div>
<div class="ar" id="ar"></div>
<div class="tr" id="tr"></div>
<div class="hint">tap to reveal meaning &amp; how to use it</div>
</div>
<div class="face back" id="back"></div>
</div>
</div>

<div class="ctrl">
<button class="b" id="prev" aria-label="Previous card">← Prev</button>
<button class="b main" id="learn">Mark learned</button>
<button class="b" id="next" aria-label="Next card">Next →</button>
</div>
<div class="ctrl">
<button class="b" id="today">✦ Name of the day</button>
<button class="b" id="shuf">Shuffle</button>
<button class="b" id="only">Unlearned only</button>
</div>
<div class="small"><a id="reset">Reset progress</a></div>
<div class="note">Allah (الله) is the name that holds all the others. Say “Yā” before a name when calling on Him, e.g. “Yā Raḥīm.”<br>Tip: use ← → and Space on a keyboard.</div>
</div>
<div id="v-browse" class="view" hidden><input id="q" class="inp" placeholder="Search by name or meaning…" aria-label="Search names"><div class="grid" id="grid"></div></div>
<div id="v-daily" class="view" hidden></div>
<div id="v-set" class="view" hidden></div>
</div>

<script>
var DATA = `الرحمن|Ar-Raḥmān|The Most Gracious|M

var $ = function(id){return document.getElementById(id)};
var learned = {};
try{ learned = JSON.parse(localStorage.getItem("n99_learned")||"{}") || {}; }catch(e){ learned = {}; }
function save(){ try{ localStorage.setItem("n99_learned", JSON.stringify(learned)); }catch(e){} }

var order = DATA.map(function(_,i){return i});
var pos = 0, onlyUn = false, busy = null;

function cur(){ return order[pos]; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render(){
  var i = cur(), d = DATA[i], c = CATS[d.c];
  $("num").textContent = (i+1) + " / 99";
  $("ar").textContent = d.ar;
  $("tr").textContent = d.tr;
  var dua = c.s.replace("{n}", d.tr);
  $("back").innerHTML =
    '<h2>'+esc(d.tr)+' · <span class="arf">'+esc(d.ar)+'</span></h2>'+
    '<p class="mean">'+esc(d.me)+'</p>'+
    '<div class="sec"><b>When to say it</b><p>'+esc(c.w)+'</p></div>'+
    '<div class="sec"><b>Using it in dua</b><p>Call on Him by this name when '+esc(c.d)+'</p><p class="dua" style="margin-top:6px">'+esc(dua)+'</p><button class="copy" id="copy">Copy dua</button></div>'+
    '<div class="sec"><b>Reminder</b><p>'+esc(c.r)+'</p></div>';
  var cp = $("copy");
  cp.onclick = function(e){
    e.stopPropagation();
    var done = function(){ cp.textContent = "Copied ✓"; setTimeout(function(){ cp.textContent = "Copy dua"; }, 1400); };
    try{ navigator.clipboard.writeText(dua).then(done, function(){ cp.textContent="Select & copy"; }); }
    catch(err){ cp.textContent = "Select & copy"; }
  };
  $("pos").textContent = "Card " + (pos+1) + " of " + order.length;
  var n = Object.keys(learned).length;
  $("lcount").textContent = n + " learned";
  $("bar").style.width = (n/99*100) + "%";
  $("learn").textContent = learned[i] ? "Learned ✓" : "Mark learned";
  $("learn").className = "b main" + (learned[i] ? " on" : "");
  $("only").className = "b" + (onlyUn ? " on" : "");
  $("back").scrollTop = 0;
}

function unflip(cb){
  var f = $("flip");
  if(f.classList.contains("on")){
    f.classList.remove("on");
    clearTimeout(busy);
    busy = setTimeout(cb, 260);
  } else { cb(); }
}
function go(delta){
  if(!order.length) return;
  unflip(function(){
    pos = (pos + delta + order.length) % order.length;
    render();
  });
}
function jumpTo(idx){
  unflip(function(){
    var p = order.indexOf(idx);
    if(p < 0){ onlyUn = false; order = DATA.map(function(_,i){return i}); p = idx; }
    pos = p; render();
  });
}
function flip(){ $("flip").classList.toggle("on"); }

function rebuild(keepIdx){
  var all = DATA.map(function(_,i){return i});
  order = onlyUn ? all.filter(function(i){return !learned[i]}) : all;
  if(!order.length){
    onlyUn = false; order = all;
    $("lcount").textContent = "All 99 learned! 🌙";
  }
  var p = order.indexOf(keepIdx);
  pos = p >= 0 ? p : 0;
}

$("flip").addEventListener("click", flip);
$("prev").addEventListener("click", function(){ go(-1); });
$("next").addEventListener("click", function(){ go(1); });
$("learn").addEventListener("click", function(){
  var i = cur();
  if(learned[i]) delete learned[i]; else learned[i] = 1;
  save();
  render();
});
$("shuf").addEventListener("click", function(){
  unflip(function(){
    for(var k = order.length-1; k > 0; k--){ var j = Math.floor(Math.random()*(k+1)); var t = order[k]; order[k] = order[j]; order[j] = t; }
    pos = 0; render();
  });
});
$("only").addEventListener("click", function(){
  var keep = cur();
  unflip(function(){
    onlyUn = !onlyUn;
    rebuild(keep);
    render();
  });
});
$("today").addEventListener("click", function(){
  var now = new Date(), start = new Date(now.getFullYear(),0,0);
  var day = Math.floor((now - start)/86400000);
  jumpTo(day % 99);
});
$("reset").addEventListener("click", function(){
  if(Object.keys(learned).length && !confirm("Clear all learned progress?")) return;
  learned = {}; save(); onlyUn = false;
  unflip(function(){ order = DATA.map(function(_,i){return i}); pos = 0; render(); });
});
document.addEventListener("keydown", function(e){
  var t = e.target && e.target.tagName;
  if(t === "BUTTON" || t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || curView !== "cards") return;
  if(e.key === "ArrowRight"){ go(1); }
  else if(e.key === "ArrowLeft"){ go(-1); }
  else if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
});

var curView = "cards";
function show(v){
  curView = v;
  ["cards","browse","daily","set"].forEach(function(k){ $("v-"+k).hidden = (k !== v); });
  document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === v); });

}

function norm(s){ return s.normalize("NFD").replace(/[\u0300-\u036f\u02bf\u02be’ʿʾ-]/g,"").toLowerCase(); }
function drawGrid(){
  var q = norm($("q").value.trim()), h = "";
  DATA.forEach(function(d,i){
    if(q && norm(d.tr + " " + d.me).indexOf(q) < 0 && d.ar.indexOf(q) < 0) return;
    h += '<button class="tile'+(learned[i]?' l':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="a">'+esc(d.ar)+'</span><span class="t">'+esc(d.tr)+'</span></button>';
  });
  $("grid").innerHTML = h || '<p class="mut cen" style="grid-column:1/-1">No names match that search.</p>';
}
$("q").addEventListener("input", drawGrid);
$("grid").addEventListener("click", function(e){
  var t = e.target.closest(".tile"); if(!t) return;
  var i = +t.dataset.i;
  show("cards"); jumpTo(i);
});

/* ---------- daily ---------- */
function dkey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayIdx(){ var n = new Date(), s = new Date(n.getFullYear(),0,0); return Math.floor((n - s)/86400000) % 99; }
var daily = {tasks:{}, notes:{}};
try{ var xd = JSON.parse(localStorage.getItem("n99_daily")||"null"); if(xd && xd.tasks){ daily = xd; if(!daily.notes) daily.notes = {}; } }catch(e){}
function saveD(){ try{ localStorage.setItem("n99_daily", JSON.stringify(daily)); }catch(e){} }
var TASKS = ["Open today’s name and read its meaning","Say the name 33 times after a prayer (use the counter)","Use it in a dua, in your own words","Review three names you’ve already seen","Notice one moment today when this name felt true"];
function doneN(k){ var a = daily.tasks[k]; return a ? a.filter(Boolean).length : 0; }
function streak(){
  var d = new Date(), n = 0;
  if(doneN(dkey(d)) < TASKS.length) d.setDate(d.getDate()-1);
  while(doneN(dkey(d)) === TASKS.length){ n++; d.setDate(d.getDate()-1); }
  return n;
}
var count = 0;
function drawDaily(){
  var k = dkey(new Date()), i = dayIdx(), d = DATA[i], c = CATS[d.c], t = daily.tasks[k] || [], n = doneN(k), hr = new Date().getHours();
  var greet = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
  var h = '<div class="panel cen"><div class="mut">'+greet+'. Today’s name</div><div class="big arf">'+esc(d.ar)+'</div><div style="font-size:24px;font-weight:600">'+esc(d.tr)+'</div><div style="color:var(--gold);font-style:italic">'+esc(d.me)+'</div><p style="margin:10px 0">'+esc(c.r)+'</p><button class="b" id="open">Open flashcard</button></div>';
  h += '<div class="panel"><h3>Today’s tasks · '+n+'/'+TASKS.length+'</h3>';
  TASKS.forEach(function(x,j){ h += '<button class="task'+(t[j]?' d':'')+'" data-t="'+j+'"><span class="bx">'+(t[j]?'✓':'')+'</span><span>'+esc(x)+'</span></button>'; });
  h += '<p class="mut cen" style="margin:10px 0 0">'+(n === TASKS.length ? 'All done. May it be accepted. 🌙' : 'A little every day beats a lot once.')+'</p><p class="cen" style="margin:6px 0 0">🔥 '+streak()+' day streak</p></div>';
  h += '<div class="panel cen"><h3>Counter</h3><div class="mut">Tap once for each time you say “Yā '+esc(d.tr)+'”</div><button class="tap" id="tap" aria-label="Count">'+count+' / 33</button><button class="b" id="resetc">Reset counter</button></div>';
  h += '<div class="panel"><h3>Reflection</h3><textarea class="inp" id="note" placeholder="Where did you see this name in your day?">'+esc(daily.notes[k]||"")+'</textarea></div>';
  h += '<p class="note">Progress is saved on this device only. A page like this can’t send push notifications, so try pinning it to your home screen or setting a phone alarm labelled with today’s name.</p>';
  $("v-daily").innerHTML = h;
}
$("v-daily").addEventListener("click", function(e){
  var k = dkey(new Date()), b;
  if((b = e.target.closest("[data-t]"))){
    var a = daily.tasks[k] || []; while(a.length < TASKS.length) a.push(false);
    a[+b.dataset.t] = !a[+b.dataset.t]; daily.tasks[k] = a; saveD(); drawDaily();
  } else if(e.target.closest("#tap")){
    count = count >= 33 ? 1 : count + 1;
    $("tap").textContent = count + " / 33";
    if(count === 33){
      var a2 = daily.tasks[k] || []; while(a2.length < TASKS.length) a2.push(false);
      a2[1] = true; daily.tasks[k] = a2; saveD(); drawDaily();
    }
  } else if(e.target.closest("#resetc")){ count = 0; drawDaily(); }
  else if(e.target.closest("#open")){ show("cards"); jumpTo(dayIdx()); }
});
$("v-daily").addEventListener("input", function(e){
  if(e.target.id === "note"){ daily.notes[dkey(new Date())] = e.target.value; saveD(); }
});

  Object.keys(THEMES).forEach(function(k){ var t = THEMES[k];
    h += '<button class="sw'+(S.theme===k&&!S.bg?' on':'')+'" data-th="'+k+'" title="'+k+'" aria-label="'+k+'" style="background:'+(t.sw||'linear-gradient(135deg,'+t.bg+' 50%,'+t.gold+' 50%)')+'"></button>'; });
  h += '</div><p class="mut" style="margin:10px 0 6px">Or pick any colour'+(S.bg?' (custom colour active)':'')+':</p><input type="color" id="cbg" value="'+(S.bg||"#f6f0e4")+'" aria-label="Custom background colour"> ';
  if(S.bg) h += '<button class="b" id="clr" style="font-size:15px;padding:4px 12px">Clear custom</button>';
  h += '</div><div class="panel"><h3>Fonts</h3><label class="mut">Text</label><select class="inp" id="sbf">';
  Object.keys(BF).forEach(function(k){ h += '<option value="'+k+'"'+(S.bf===k?' selected':'')+'>'+BFN[k]+'</option>'; });
  h += '</select><label class="mut">Arabic</label><select class="inp" id="saf">';
  Object.keys(AF).forEach(function(k){ h += '<option value="'+k+'"'+(S.af===k?' selected':'')+'>'+AFN[k]+'</option>'; });
  h += '</select><div class="cen" style="margin-top:8px"><div class="big arf">'+esc(DATA[1].ar)+'</div><div style="font-size:22px">'+esc(DATA[1].tr)+' · '+esc(DATA[1].me)+'</div></div></div>';
  h += '<div class="cen"><button class="b" id="rst">Reset appearance</button></div>';
  $("v-set").innerHTML = h;
}
$("v-set").addEventListener("click", function(e){
  var b = e.target.closest("[data-th]");
  if(b){ S.theme = b.dataset.th; S.bg = ""; saveS(); applyS(); drawSet(); }
  else if(e.target.closest("#clr")){ S.bg = ""; saveS(); applyS(); drawSet(); }
  else if(e.target.closest("#rst")){ S = {theme:"sunset", bg:"", bf:"cg", af:"amiri"}; saveS(); applyS(); drawSet(); }
});
$("v-set").addEventListener("input", function(e){
  if(e.target.id === "cbg"){ S.bg = e.target.value; saveS(); applyS(); }
});
$("v-set").addEventListener("change", function(e){
  if(e.target.id === "cbg"){ drawSet(); }
  if(e.target.id === "sbf"){ S.bf = e.target.value; saveS(); applyS(); }
  if(e.target.id === "saf"){ S.af = e.target.value; saveS(); applyS(); }
});

applyS();
render();
</script>
</body>
</html>
